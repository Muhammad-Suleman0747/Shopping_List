<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Interactive Shopping List</title>
        <style>
            :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
            body{max-width:720px;margin:48px auto;padding:20px;color:#222}
            h1{display:flex;align-items:center;gap:.5rem}
            .controls{display:flex;gap:.5rem;margin:12px 0}
            input[type="text"]{flex:1;padding:.5rem;border:1px solid #ccc;border-radius:6px}
            button{padding:.5rem .75rem;border-radius:6px;border:1px solid #888;background:#f6f6f6;cursor:pointer}
            button.primary{background:#0b74de;color:#fff;border-color:#075fa8}
            ul{list-style:none;padding:0;margin:1rem 0}
            li{display:flex;align-items:center;justify-content:space-between;padding:.5rem;border-radius:6px;border:1px solid #eee;margin-bottom:.5rem;background:#fff}
            .item-text{margin-right:1rem;word-break:break-word}
            .remove{background:#ff6b6b;border-color:#d64545;color:#fff}
            .meta{color:#666;font-size:.9rem;margin-top:.5rem}
            .hidden{display:none}
        </style>
    </head>
    <body>
        <h1>Shopping List</h1>

        <div class="controls" aria-label="add item">
            <input id="itemInput" type="text" placeholder="Enter item and press Add or Enter" aria-label="Item name" />
            <button id="addBtn" class="primary">Add</button>
            <button id="clearBtn" title="Remove all items">Clear All</button>
        </div>

        <ul id="list" aria-live="polite"></ul>

        <div class="meta">
            <span id="count">0</span> item(s)
        </div>

        <script>
            // Contract:
            // - input: text string from #itemInput
            // - output: new <li> appended to #list with a remove button
            // - errors: empty input is ignored and input is focused

            const input = document.getElementById('itemInput');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');
            const list = document.getElementById('list');
            const count = document.getElementById('count');

            function updateCount(){
                count.textContent = list.children.length;
            }

            function createListItem(text){
                const li = document.createElement('li');
                const span = document.createElement('span');
                span.className = 'item-text';
                span.textContent = text;

                const remove = document.createElement('button');
                remove.className = 'remove';
                remove.type = 'button';
                remove.textContent = 'Remove';

                remove.addEventListener('click', () => {
                    li.remove();
                    updateCount();
                    // return focus to the input for faster entry
                    input.focus();
                });

                li.appendChild(span);
                li.appendChild(remove);
                return li;
            }

            function addItem(){
                const value = input.value.trim();
                if(!value){
                    // simple feedback: shake the input briefly
                    input.classList.add('invalid');
                    input.focus();
                    return;
                }

                const li = createListItem(value);
                list.appendChild(li);
                input.value = '';
                input.focus();
                updateCount();
            }

            addBtn.addEventListener('click', addItem);

            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') addItem();
            });

            clearBtn.addEventListener('click', () => {
                if(!list.children.length) return;
                if(!confirm('Remove all items from the shopping list?')) return;
                list.innerHTML = '';
                updateCount();
                input.focus();
            });

            // accessibility: announce initial count
            updateCount();
        </script>
    </body>
</html>
